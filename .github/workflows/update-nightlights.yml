name: Update nightlights data

on:
  schedule:
    # 毎月5日 03:00 UTC (日本時間 12:00) に実行
    - cron: "0 3 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Fetch new months from Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/update_from_gee.py

      - name: Rebuild nightlights.json
        run: python scripts/build_data.py data/raw/nightlights_raw.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/nightlights_raw.csv data/nightlights.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 夜間光データを自動更新"
            git push
          fi
